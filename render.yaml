services:
  - type: web
    name: unik-post
    runtime: python
    plan: free
    region: singapore
    branch: unikpost
    buildCommand: pip install -r requirements.txt
    # 1 worker on purpose: the scheduler thread and login rate limiter live in-process.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 300 --graceful-timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: MAX_UPLOAD_MB
        value: "2048"
