services:
  - type: web
    name: unik-ai-studio
    runtime: python
    plan: free
    branch: aistudio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FAL_KEY
        sync: false
      - key: VIDEO_ENABLED
        value: "false"
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
